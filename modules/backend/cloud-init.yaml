#cloud-config
# Bootstrap mínimo da VM do backend.
# Instala Python 3.12 + utilitários, cria usuário 'appuser', abre portas no firewalld.
# O deploy da aplicação (clone do repo, .env, systemd unit) é manual neste passo
# porque o repo é privado — siga `deploy/deployPlan.md` no ost-backend.python.

package_update: true
package_upgrade: false

packages:
  - python3.12
  - python3.12-pip
  - python3.12-devel
  - git
  - postgresql16
  - gcc
  - make

users:
  - name: appuser
    shell: /bin/bash
    groups: wheel
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true

write_files:
  - path: /etc/systemd/system/ost-backend.service
    permissions: "0644"
    content: |
      [Unit]
      Description=OneShift Backend (FastAPI + Gunicorn)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=appuser
      WorkingDirectory=/opt/ost-backend
      EnvironmentFile=/etc/ost-backend/.env
      ExecStart=/opt/ost-backend/.venv/bin/gunicorn \
        app.main:app \
        --worker-class uvicorn.workers.UvicornWorker \
        --workers 2 \
        --bind 0.0.0.0:8000 \
        --timeout 120 \
        --graceful-timeout 30
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

runcmd:
  - mkdir -p /opt/ost-backend /etc/ost-backend
  - chown -R appuser:appuser /opt/ost-backend /etc/ost-backend
  - firewall-cmd --permanent --add-port=80/tcp
  - firewall-cmd --permanent --add-port=443/tcp
  - firewall-cmd --permanent --add-port=8000/tcp
  - firewall-cmd --reload
  - systemctl daemon-reload
  # ost-backend.service ficará 'enabled' mas só inicia após deploy manual:
  - systemctl enable ost-backend.service
