apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp
  template:
    metadata:
      labels:
        app: mcp
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: mcp
          image: ghcr.io/oneshift-organization/ost-mcp.nodejs/ost-mcp:main-1784169748-a17f9a90df56 # {"$imagepolicy": "flux-system:mcp"}
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          envFrom:
            - secretRef:
                name: mcp-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
