apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: api
          image: ghcr.io/oneshift-organization/ost-backend.python/ost-api:main-1793198178-080110ce3e0b # {"$imagepolicy": "flux-system:api"}
          ports:
            - containerPort: 8000
          env:
            - name: INVENTORY_ENABLED
              value: "true"
            - name: AGENT_SNAPSHOT_ENABLED
              value: "true"
          envFrom:
            - secretRef:
                name: api-secret
            - secretRef:
                name: api-gcp-billing-secret
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
