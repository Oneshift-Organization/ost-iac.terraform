apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp
  namespace: production
spec:
  ingressClassName: nginx
  rules:
    - host: mcp.oneshift.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcp
                port:
                  number: 8080
