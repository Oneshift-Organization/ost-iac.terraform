apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: develop
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: api-dev.oneshift.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
