apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: develop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: api
          image: ghcr.io/oneshift-organization/ost-backend.python/ost-api:develop-1793024806-909230d5304a # {"$imagepolicy": "flux-system:api-dev"}
          ports:
            - containerPort: 8000
          env:
            - name: AGENT_FLOW_ENABLED
              value: "true"
            - name: INVENTORY_ENABLED
              value: "true"
            - name: AGENT_SNAPSHOT_ENABLED
              value: "true"
            # Origens do front: app.oneshift.com.br entra antes da troca de domínio do front de dev
            - name: CORS_ORIGINS
              value: '["http://localhost:3000","https://dev.oneshift.com.br","https://app.oneshift.com.br","https://oneshift.com.br"]'
          envFrom:
            - secretRef:
                name: api-secret
            - secretRef:
                name: api-nvidia-fallback-secret
            - secretRef:
                name: api-gcp-billing-secret
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
