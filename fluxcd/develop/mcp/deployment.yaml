apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  namespace: develop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp
  template:
    metadata:
      labels:
        app: mcp
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: mcp
          image: ghcr.io/oneshift-organization/ost-mcp.nodejs/ost-mcp:develop-1792371670-40b9eb85c6ff # {"$imagepolicy": "flux-system:mcp-dev"}
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: NODE_ENV
              value: "production"
            - name: OST_API_BASE_URL
              value: "http://api.develop.svc.cluster.local:8000"
            - name: CORS_ORIGINS
              value: "https://dev.oneshift.com.br,https://inspector.oneshift.com.br"
            - name: MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-secret
                  key: MCP_TOKEN
            # Snapshot isolates agent revisions from analyses shown in the UI.
            - name: MCP_BILLING_CONTRACT
              value: "snapshot"
            # Both gates remain empty, overriding any values inherited from the Secret.
            - name: MCP_SUBMIT_TEST_SNAPSHOT_IDS
              value: ""
            - name: MCP_SUBMIT_TEST_REPORT_IDS
              value: ""
          envFrom:
            - secretRef:
                name: mcp-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
