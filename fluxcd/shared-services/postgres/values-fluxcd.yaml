apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bitnami
  namespace: shared-services
spec:
  interval: 1h
  url: https://charts.bitnami.com/bitnami
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres
  namespace: shared-services
spec:
  interval: 1h
  releaseName: postgres
  chart:
    spec:
      chart: postgresql
      version: "18.8.0"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: shared-services
  values:
    fullnameOverride: postgres
    auth:
      username: ostadmin
      database: ost
      existingSecret: postgres-secret
      secretKeys:
        adminPasswordKey: postgres-password
        userPasswordKey: password
    primary:
      persistence:
        enabled: true
        storageClass: oci-bv
        size: 10Gi
      resources:
        requests:
          cpu: "250m"
          memory: "512Mi"
        limits:
          cpu: "1000m"
          memory: "1Gi"
