---
# Acesso do time ao Postgres. O banco nao e exposto por ingress — a
# conexao e sempre por `kubectl port-forward`, que exige tres coisas:
# resolver o Service, listar o pod por tras dele e abrir o tunel.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oneshift-devs-db
  namespace: shared-services
rules:
  - apiGroups: [""]
    resources: ["services", "pods"]
    verbs: ["get", "list"]

  # `resourceNames` prende o tunel ao postgres-0 e so a ele. O nome e
  # estavel porque e StatefulSet — sem isso o time abriria tunel para
  # qualquer pod do namespace, incluindo ingress-nginx e external-dns.
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
    resourceNames: ["postgres-0"]

  # Credencial do banco. E a mesma que a aplicacao usa (ostadmin), entao
  # o acesso e total por decisao explicita. `resourceNames` impede que a
  # regra alcance os demais secrets do namespace, como o token da
  # Cloudflare e o do inspector.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["postgres-secret"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oneshift-devs-db
  namespace: shared-services
