---
# Leitura de recursos de escopo global (nodes, namespaces). Sem isso o
# `kubectl get nodes` do time falha mesmo com o RoleBinding do namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oneshift-devs-view
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oneshift-devs-view
subjects:
  # No OKE a identidade Kubernetes e o OCID do usuario OCI, nao o e-mail.
  - kind: User # anderson_huang — rm565920@fiap.com.br
    name: ocid1.user.oc1..aaaaaaaaprpb74vxj6f2dcuvqnb4fnntdu7le2lo7c5yickscofd5v5w3cha
    apiGroup: rbac.authorization.k8s.io
  - kind: User # bruno_henrique — rm566277@fiap.com.br
    name: ocid1.user.oc1..aaaaaaaaz3xded56p4tygzsaap3yk5lseymofm5o5tbzmqbxc75q2agc2eaq
    apiGroup: rbac.authorization.k8s.io
  - kind: User # ronaldo_attamah — rm564630@fiap.com.br
    name: ocid1.user.oc1..aaaaaaaax3d7auhg35imvmrf4uqdnosjlviililexwwy4njall4r6flgnena
    apiGroup: rbac.authorization.k8s.io
  - kind: User # guylherme_miguel — rm562374@fiap.com.br
